# What this client supports. The runner filters its cases to these axes, so a
# passing run means every applicable case passed.
#
# TLS is absent on purpose: baskingspot/tls has no nonblocking client and
# baskingspot/http has no client transport to wrap, so there is nothing to
# negotiate a connection with yet.
features:
  versions: [HTTP_VERSION_2]
  protocols: [PROTOCOL_GRPC]
  codecs: [CODEC_PROTO]
  compressions: [COMPRESSION_IDENTITY, COMPRESSION_GZIP]
  stream_types:
    - STREAM_TYPE_UNARY
    - STREAM_TYPE_CLIENT_STREAM
    - STREAM_TYPE_SERVER_STREAM
    - STREAM_TYPE_HALF_DUPLEX_BIDI_STREAM
    - STREAM_TYPE_FULL_DUPLEX_BIDI_STREAM
  supports_h2c: true
  supports_tls: false
  supports_trailers: true
  supports_message_receive_limit: true
