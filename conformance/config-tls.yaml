# The same claims as config.yaml, with TLS on.
#
# This is the target, not the current state: `tls_nonblocking.Client` does not
# exist yet, so every case here fails with UnsupportedTls. `just conformance`
# stays green against config.yaml until the TLS transport lands.
features:
  versions: [HTTP_VERSION_2]
  protocols: [PROTOCOL_GRPC]
  codecs: [CODEC_PROTO]
  compressions: [COMPRESSION_IDENTITY, COMPRESSION_GZIP]
  stream_types:
    - STREAM_TYPE_UNARY
    - STREAM_TYPE_CLIENT_STREAM
    - STREAM_TYPE_SERVER_STREAM
    - STREAM_TYPE_HALF_DUPLEX_BIDI_STREAM
    - STREAM_TYPE_FULL_DUPLEX_BIDI_STREAM
  supports_h2c: true
  supports_tls: true
  supports_tls_client_certs: false
  supports_trailers: true
  supports_message_receive_limit: true
