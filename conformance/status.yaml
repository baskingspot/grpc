name: Deadline Status Preservation
mode: TEST_MODE_CLIENT
relevantProtocols:
  - PROTOCOL_GRPC
relevantCodecs:
  - CODEC_PROTO
testCases:
  - request:
      testName: unary/canceled-before-deadline
      streamType: STREAM_TYPE_UNARY
      timeoutMs: 2000
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            error:
              code: CODE_CANCELED
              message: canceled by the server
  - request:
      testName: unary/internal-before-deadline
      streamType: STREAM_TYPE_UNARY
      timeoutMs: 2000
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            error:
              code: CODE_INTERNAL
              message: internal server error
  - request:
      testName: unary/unavailable-before-deadline
      streamType: STREAM_TYPE_UNARY
      timeoutMs: 2000
      requestMessages:
        - "@type": type.googleapis.com/connectrpc.conformance.v1.UnaryRequest
          responseDefinition:
            error:
              code: CODE_UNAVAILABLE
              message: server unavailable
